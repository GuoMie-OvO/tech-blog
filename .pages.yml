media:
  input: public/uploads
  output: /uploads
  categories: [image]
content:
  - name: posts
    label: 技术文章
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, pubDatetime, draft]
      sort: pubDatetime
      order: desc
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: author, label: 作者, type: string, default: 黎健恒 }
      - name: pubDatetime
        label: 发布时间
        type: date
        required: true
        options: { time: true }
      - name: modDatetime
        label: 更新时间
        type: date
        options: { time: true }
      - { name: description, label: 摘要, type: text, required: true }
      - { name: tags, label: 标签, type: string, list: true }
      - { name: featured, label: 精选, type: boolean, default: false }
      - { name: draft, label: 草稿, type: boolean, default: true }
      - { name: ogImage, label: 封面图片, type: image }
      - { name: body, label: 正文, type: rich-text, required: true }
  - name: about
    label: 关于我
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: description, label: 摘要, type: text }
      - { name: body, label: 正文, type: rich-text }
  - name: projects
    label: 个人作品
    type: file
    path: src/content/pages/projects.md
    format: yaml-frontmatter
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: description, label: 摘要, type: text }
      - { name: body, label: 正文, type: rich-text }
